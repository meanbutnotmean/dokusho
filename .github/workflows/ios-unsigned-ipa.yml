name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build app for iOS device
        run: >-
          xcodebuild
          -project ios/Dokusho.xcodeproj
          -scheme Dokusho
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify app bundle before packaging
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Dokusho.app"
          test -x "$APP/Dokusho"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist"
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Dokusho.app build/ipa/Payload/
          cd build/ipa
          zip -r ../../Dokusho-unsigned.ipa Payload
      - uses: actions/upload-artifact@v6
        with:
          name: Dokusho-unsigned-ipa
          path: Dokusho-unsigned.ipa
          retention-days: 7
